<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>社内管理 — 進捗データベース</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="topbar">
  <div>
    <h1>社内管理・進捗データベース</h1>
    <div class="sub">全案件の状況／日報・報告書</div>
  </div>
  <span id="mode" class="demo-tag">デモ</span>
</div>

<div class="wrap">
  <div class="metrics">
    <div class="metric"><div class="k">進行中の案件</div><div class="v" id="mActive">–</div></div>
    <div class="metric"><div class="k">今日の記録</div><div class="v" id="mToday">–</div></div>
    <div class="metric"><div class="k">納期が近い(7日内)</div><div class="v" id="mDue" style="color:var(--warn)">–</div></div>
  </div>

  <div class="card">
    <h2>案件一覧</h2>
    <table>
      <thead>
        <tr><th>案件</th><th>顧客</th><th class="hide-sp">担当</th><th>進捗</th><th class="hide-sp">最終記録</th><th></th></tr>
      </thead>
      <tbody id="projectRows"></tbody>
    </table>
  </div>

  <div class="card" id="detailCard" style="display:none">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px">
      <h2 id="detailTitle" style="margin:0"></h2>
      <div style="display:flex; gap:8px">
        <button class="btn btn-sm" id="btnDaily">📄 日報を出力</button>
        <button class="btn btn-sm" id="btnReport">📋 報告書を生成</button>
      </div>
    </div>
    <p class="hint" id="detailMeta"></p>
    <table>
      <thead><tr><th>日時</th><th>工程</th><th>進捗</th><th class="hide-sp">数量</th><th>入力者</th><th>コメント</th><th></th></tr></thead>
      <tbody id="logRows"></tbody>
    </table>
  </div>

  <p class="hint" style="text-align:center"><a href="index.html">← 入口にもどる</a></p>
</div>

<div class="toast" id="toast"></div>

<script src="store.js"></script>
<script>
let projects=[], allLogs=[], processMap={}, currentProjectId=null;

async function init(){
  if(!Store.isDemo()) document.getElementById("mode").style.display="none";
  projects = await Store.getProjects();
  allLogs = await Store.getAllLogs();

  // 工程名の辞書を作る
  for(const p of projects){
    const procs = await Store.getProcesses(p.id);
    procs.forEach(w=> processMap[w.id]=w.name);
  }

  renderMetrics();
  renderProjects();
}

function renderMetrics(){
  const active = projects.filter(p=>p.status!=="完了").length;
  const today = new Date().toDateString();
  const todayLogs = allLogs.filter(l=> new Date(l.datetime).toDateString()===today).length;
  const soon = projects.filter(p=>{
    const diff = (new Date(p.dueDate) - new Date())/86400000;
    return p.status!=="完了" && diff>=0 && diff<=7;
  }).length;
  document.getElementById("mActive").textContent = active;
  document.getElementById("mToday").textContent = todayLogs;
  document.getElementById("mDue").textContent = soon;
}

function projectProgress(p){
  const logs = allLogs.filter(l=>l.projectId===p.id);
  if(!logs.length) return 0;
  return logs.sort((a,b)=>new Date(b.datetime)-new Date(a.datetime))[0].progress;
}
function lastLogTime(p){
  const logs = allLogs.filter(l=>l.projectId===p.id);
  if(!logs.length) return "–";
  return Util.fmtDate(logs.sort((a,b)=>new Date(b.datetime)-new Date(a.datetime))[0].datetime);
}
function statusBadge(s){
  const cls = s==="完了"?"badge-ok": s==="作業中"?"badge-warn":"badge-idle";
  return `<span class="badge ${cls}">${s}</span>`;
}

function renderProjects(){
  document.getElementById("projectRows").innerHTML = projects.map(p=>{
    const prog = projectProgress(p);
    return `<tr class="clickable" onclick="openDetail('${p.id}')">
      <td>${p.name}</td>
      <td>${p.customerName}</td>
      <td class="hide-sp">${p.owner}</td>
      <td><div style="display:flex; align-items:center; gap:8px">
        <div class="bar ${prog>=100?'full':''}"><span style="width:${prog}%"></span></div>
        <span style="font-size:13px; width:34px">${prog}%</span></div></td>
      <td class="hide-sp" style="color:var(--muted)">${lastLogTime(p)}</td>
      <td>${statusBadge(p.status)}</td>
    </tr>`;
  }).join("");
}

function openDetail(pid){
  currentProjectId = pid;
  const p = projects.find(x=>x.id===pid);
  const logs = allLogs.filter(l=>l.projectId===pid).sort((a,b)=>new Date(b.datetime)-new Date(a.datetime));
  document.getElementById("detailCard").style.display="block";
  document.getElementById("detailTitle").textContent = `${p.customerName} ${p.name}`;
  document.getElementById("detailMeta").textContent =
    `担当 ${p.owner} ・ 開始 ${p.startDate} ・ 納期 ${p.dueDate} ・ 記録 ${logs.length}件`;
  document.getElementById("logRows").innerHTML = logs.map(l=>`
    <tr>
      <td style="white-space:nowrap">${Util.fmtDate(l.datetime)}</td>
      <td>${processMap[l.processId]||"–"}</td>
      <td>${l.progress}% ${statusBadge(l.status)}</td>
      <td class="hide-sp">${l.qty||""}</td>
      <td>${l.author}</td>
      <td>${l.comment||""}</td>
      <td>${l.photo?(p=>`<img src="${p}" style="width:44px;height:44px;object-fit:cover;border-radius:6px;cursor:pointer" onclick="window.open('${p}','_blank')">`)(Util.photoUrl(l.photo)):""}</td>
    </tr>`).join("");
  document.getElementById("detailCard").scrollIntoView({behavior:"smooth"});
}

/* ---- 日報・報告書の生成（新しいタブに整形して開く → 印刷でPDF化可） ---- */
function buildDoc(kind){
  const p = projects.find(x=>x.id===currentProjectId);
  const logs = allLogs.filter(l=>l.projectId===currentProjectId).sort((a,b)=>new Date(a.datetime)-new Date(b.datetime));
  const rows = logs.map(l=>`<tr>
     <td>${Util.fmtDate(l.datetime)}</td><td>${processMap[l.processId]||""}</td>
     <td>${l.progress}%</td><td>${l.status}</td><td>${l.qty||""}</td>
     <td>${l.author}</td><td>${l.comment||""}</td></tr>`).join("");
  const isDaily = kind==="daily";
  const title = isDaily ? "作業日報" : "進捗報告書";
  const today = Util.fmtDay(new Date().toISOString());
  const prog = logs.length ? logs[logs.length-1].progress : 0;

  const html = `<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><title>${title}</title>
  <style>
    body{font-family:"Yu Gothic",Meiryo,sans-serif; color:#1c2430; margin:40px; line-height:1.7}
    h1{font-size:22px; border-bottom:2px solid #2f6bd8; padding-bottom:8px}
    .info{margin:16px 0; font-size:14px}
    .info b{display:inline-block; width:80px; color:#6b7280; font-weight:normal}
    table{width:100%; border-collapse:collapse; font-size:13px; margin-top:14px}
    th,td{border:1px solid #d0d3d8; padding:7px 8px; text-align:left}
    th{background:#f4f5f7}
    .sum{margin-top:16px; font-size:14px}
    .foot{margin-top:30px; font-size:12px; color:#9aa0a8}
    @media print{.noprint{display:none}}
    .btn{margin-top:24px; padding:10px 18px; background:#2f6bd8; color:#fff; border:none; border-radius:6px; font-size:14px; cursor:pointer}
  </style></head><body>
    <h1>${title}</h1>
    <div class="info">
      <div><b>案件</b> ${p.customerName} ${p.name}</div>
      <div><b>顧客</b> ${p.customerName}</div>
      <div><b>担当</b> ${p.owner}</div>
      <div><b>納期</b> ${p.dueDate}</div>
      <div><b>作成日</b> ${today}</div>
    </div>
    <div class="sum">現在の進捗率：<b>${prog}%</b> ／ 記録件数：${logs.length}件</div>
    <table>
      <thead><tr><th>日時</th><th>工程</th><th>進捗</th><th>状態</th><th>数量</th><th>入力者</th><th>コメント</th></tr></thead>
      <tbody>${rows||'<tr><td colspan=7>記録がありません</td></tr>'}</tbody>
    </table>
    <div class="foot">本書は進捗管理システムより自動生成されました（${today}）。</div>
    <button class="btn noprint" onclick="window.print()">印刷 / PDF保存</button>
  </body></html>`;
  const w = window.open("", "_blank");
  w.document.write(html); w.document.close();
}
document.getElementById("btnDaily").onclick = ()=>buildDoc("daily");
document.getElementById("btnReport").onclick = ()=>buildDoc("report");

function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2000);}
init();
</script>
</body>
</html>
