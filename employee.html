<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>進捗を記録 — 社員用</title>
<link rel="stylesheet" href="styles.css?v=17">
</head>
<body>
<div class="topbar">
  <div>
    <h1>進捗を記録</h1>
    <div class="sub">社員用・現場入力</div>
  </div>
  <span id="mode" class="demo-tag">デモ</span>
</div>

<div class="wrap-narrow" id="empLogin" style="display:none">
  <div class="card" style="margin-top:24px">
    <h2 style="font-size:15px;margin:0 0 12px">社員ログイン</h2>
    <label for="empPw">社員パスワード</label>
    <input type="password" id="empPw" autocomplete="current-password">
    <div style="margin-top:16px"><button class="btn btn-primary" id="empLoginBtn">ログイン</button></div>
    <p class="hint" id="empErr" style="color:var(--danger); min-height:18px; margin-top:8px"></p>
  </div>
</div>

<div class="wrap-narrow" id="empMain" style="display:none">
  <div class="card">
    <label for="project">案件</label>
    <select id="project"></select>

    <label for="process">工程</label>
    <select id="process"></select>

    <label>進捗率 <span id="progVal" style="color:var(--text); font-weight:600">0%</span></label>
    <input type="range" id="progress" min="0" max="100" step="5" value="0">

    <div class="row">
      <div>
        <label for="qty">数量</label>
        <input type="number" id="qty" inputmode="numeric" placeholder="0">
      </div>
      <div>
        <label for="status">ステータス</label>
        <select id="status">
          <option>未着手</option>
          <option selected>作業中</option>
          <option>完了</option>
          <option>要確認</option>
        </select>
      </div>
    </div>

    <label for="author">入力者</label>
    <input type="text" id="author" placeholder="氏名（例：鈴木）">

    <label for="comment">コメント・作業メモ</label>
    <textarea id="comment" placeholder="作業内容・気づき・不具合など"></textarea>

    <label>写真（複数可）</label>
    <div class="thumbs" id="thumbs"></div>
    <div class="row" style="margin-top:8px">
      <button type="button" class="btn" id="btnCam">📷 撮影</button>
      <button type="button" class="btn" id="btnLib">🖼 画像を選ぶ</button>
    </div>
    <input type="file" id="photoCam" accept="image/*" capture="environment" style="display:none">
    <input type="file" id="photoLib" accept="image/*" multiple style="display:none">
    <p class="hint" style="margin-top:6px">「撮影」でその場で撮影、「画像を選ぶ」で複数枚まとめて追加。各写真の「描く」で矢印などを書き込めます。</p>

    <div style="margin-top:18px">
      <button class="btn-primary btn" id="submit">送信して記録</button>
    </div>
  </div>

  <p class="hint" style="text-align:center">
    <a href="index.html">← 入口にもどる</a>
  </p>
</div>

<div class="toast" id="toast"></div>

<script src="store.js?v=17"></script>
<script src="annotate.js?v=17"></script>
<script>
let photos = [];

async function init(){
  if(!Store.isDemo()) document.getElementById("mode").style.display="none";
  const projects = await Store.getProjects();
  const sel = document.getElementById("project");
  sel.innerHTML = projects.map(p=>`<option value="${p.id}">${p.customerName} ${p.name}</option>`).join("");
  sel.onchange = loadProcesses;
  await loadProcesses();
}

async function loadProcesses(){
  const pid = document.getElementById("project").value;
  const procs = await Store.getProcesses(pid);
  document.getElementById("process").innerHTML =
    procs.map(w=>`<option value="${w.id}">${w.name}</option>`).join("");
}

document.getElementById("progress").oninput = (e)=>{
  document.getElementById("progVal").textContent = e.target.value + "%";
};

function renderPhotos(){
  const box = document.getElementById("thumbs");
  box.innerHTML = photos.map((src,i)=>`
    <div class="g-item">
      <img class="thumb" src="${src}" alt="写真${i+1}">
      <button class="g-del" onclick="delPhoto(${i})" title="削除">×</button>
      <button class="g-edit" onclick="editPhoto(${i})">描く</button>
    </div>`).join("");
}
window.delPhoto = (i)=>{ photos.splice(i,1); renderPhotos(); };
window.editPhoto = (i)=>{ Annotator.open(photos[i], (data)=>{ photos[i]=data; renderPhotos(); }); };

async function addFiles(fileList){
  for(const file of fileList){
    photos.push(await Util.fileToResizedDataUrl(file));
  }
  renderPhotos();
}
document.getElementById("btnCam").onclick = ()=> document.getElementById("photoCam").click();
document.getElementById("btnLib").onclick = ()=> document.getElementById("photoLib").click();
document.getElementById("photoCam").onchange = async (e)=>{ await addFiles(e.target.files); e.target.value=""; };
document.getElementById("photoLib").onchange = async (e)=>{ await addFiles(e.target.files); e.target.value=""; };

document.getElementById("submit").onclick = async ()=>{
  const btn = document.getElementById("submit");
  const projectId = document.getElementById("project").value;
  const processId = document.getElementById("process").value;
  const author = document.getElementById("author").value.trim();
  if(!author){ toast("入力者の氏名を入れてください"); return; }

  btn.disabled = true; btn.textContent = "送信中…";
  try{
    await Store.addLog({
      projectId, processId,
      datetime: new Date().toISOString(),
      author,
      progress: Number(document.getElementById("progress").value),
      status: document.getElementById("status").value,
      qty: Number(document.getElementById("qty").value || 0),
      comment: document.getElementById("comment").value.trim(),
      photos: photos,
    });
    toast("記録しました ✓");
    // 入力をリセット（案件・工程・入力者は残す）
    document.getElementById("comment").value = "";
    document.getElementById("qty").value = "";
    photos = [];
    renderPhotos();
  }catch(err){
    toast("エラー: " + err.message);
  }finally{
    btn.disabled = false; btn.textContent = "送信して記録";
  }
};

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}

/* ---- 社員ログインのゲート ---- */
function showEmpLogin(){ document.getElementById("empLogin").style.display="block"; document.getElementById("empMain").style.display="none"; }
function showEmpMain(){ document.getElementById("empLogin").style.display="none"; document.getElementById("empMain").style.display="block"; }
async function start(){
  if(Store.hasToken() && Store.role()==="employee"){
    showEmpMain();
    try{ await init(); }
    catch(e){ if(e.auth){ Store.logout(); showEmpLogin(); } else { toast("エラー: "+e.message); } }
  } else { showEmpLogin(); }
}
document.getElementById("empLoginBtn").onclick = async ()=>{
  const pw=document.getElementById("empPw").value;
  document.getElementById("empErr").textContent="";
  try{ await Store.loginEmployee(pw); showEmpMain(); await init(); }
  catch(e){ document.getElementById("empErr").textContent = e.message; }
};
document.getElementById("empPw").addEventListener("keydown",e=>{ if(e.key==="Enter") document.getElementById("empLoginBtn").click(); });
start();
</script>
</body>
</html>
