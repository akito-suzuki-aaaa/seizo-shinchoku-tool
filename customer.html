<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>進捗確認 — お客様用</title>
<link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
<div class="topbar">
  <div>
    <h1>進捗確認</h1>
    <div class="sub" id="sub">お客様用ページ</div>
  </div>
  <span id="logoutBtn" class="btn btn-sm" style="display:none">ログアウト</span>
</div>

<!-- ログイン画面 -->
<div class="wrap-narrow" id="loginView">
  <div class="card" style="margin-top:24px">
    <h2>ログイン</h2>
    <label for="loginId">ログインID</label>
    <input type="text" id="loginId" autocomplete="username" placeholder="a-sha">
    <label for="password">パスワード</label>
    <input type="password" id="password" autocomplete="current-password" placeholder="••••">
    <div style="margin-top:16px"><button class="btn btn-primary" id="doLogin">ログイン</button></div>
    <p class="hint" id="loginErr" style="color:var(--danger); min-height:18px; margin-top:8px"></p>
    <p class="hint">デモ用：ID <b>a-sha</b> / パスワード <b>1234</b>（A社）</p>
  </div>
</div>

<!-- 案件一覧・詳細 -->
<div class="wrap" id="dataView" style="display:none">
  <div id="listView">
    <div class="card">
      <h2 id="companyName"></h2>
      <div id="projectList"></div>
    </div>
  </div>

  <div id="detailView" style="display:none">
    <p class="hint"><span class="btn btn-sm" id="backBtn">← 案件一覧</span></p>
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px">
        <div>
          <h2 id="dTitle" style="margin:0 0 4px"></h2>
          <p class="hint" id="dMeta" style="margin:0"></p>
        </div>
        <span id="dBadge"></span>
      </div>
      <div style="display:flex; align-items:center; gap:10px; margin:14px 0 4px">
        <div class="bar" id="dBarWrap" style="max-width:none"><span id="dBar" style="width:0%"></span></div>
        <span id="dProg" style="font-weight:600; width:40px"></span>
      </div>
    </div>
    <div class="card">
      <h2>進捗の履歴</h2>
      <div class="timeline" id="timeline"></div>
    </div>
  </div>

  <p class="hint" style="text-align:center"><a href="index.html">← 入口にもどる</a></p>
</div>

<script src="store.js?v=8"></script>
<script>
let me=null, myProjects=[], processMap={}, photoSets={};
window.openPhotos = (logId, idx)=> Util.openImage(photoSets[logId], idx);

/* ---- ログイン ---- */
document.getElementById("doLogin").onclick = login;
document.getElementById("password").addEventListener("keydown", e=>{ if(e.key==="Enter") login(); });

async function login(){
  const id = document.getElementById("loginId").value.trim();
  const pw = document.getElementById("password").value;
  const errEl = document.getElementById("loginErr");
  errEl.textContent = "";
  try{
    me = await Store.login(id, pw);
    sessionStorage.setItem("mfg_customer", JSON.stringify(me));
    await showData();
  }catch(err){
    errEl.textContent = err.message;
  }
}

document.getElementById("logoutBtn").onclick = ()=>{
  sessionStorage.removeItem("mfg_customer");
  location.reload();
};

async function showData(){
  document.getElementById("loginView").style.display="none";
  document.getElementById("dataView").style.display="block";
  document.getElementById("logoutBtn").style.display="inline-flex";
  document.getElementById("sub").textContent = me.company + " 様";
  document.getElementById("companyName").textContent = me.company + " の案件";

  const all = await Store.getProjects();
  myProjects = all.filter(p=>p.customerId===me.id);

  for(const p of myProjects){
    const procs = await Store.getProcesses(p.id);
    procs.forEach(w=> processMap[w.id]=w.name);
  }
  renderList();
}

function statusBadge(s){
  const cls = s==="完了"?"badge-ok": s==="作業中"?"badge-warn":"badge-idle";
  return `<span class="badge ${cls}">${s}</span>`;
}

async function renderList(){
  const rows = [];
  for(const p of myProjects){
    const logs = await Store.getLogs(p.id);
    const prog = logs.length ? logs[0].progress : 0;
    rows.push(`<div class="card" style="cursor:pointer; margin-bottom:10px" onclick="openDetail('${p.id}')">
      <div style="display:flex; justify-content:space-between; align-items:center">
        <div>
          <div style="font-weight:600">${p.name}</div>
          <div class="hint">納期 ${p.dueDate} ・ 担当 ${p.owner}</div>
        </div>
        ${statusBadge(p.status)}
      </div>
      <div style="display:flex; align-items:center; gap:10px; margin-top:10px">
        <div class="bar ${prog>=100?'full':''}"><span style="width:${prog}%"></span></div>
        <span style="font-size:13px; width:36px">${prog}%</span>
      </div>
    </div>`);
  }
  document.getElementById("projectList").innerHTML = rows.join("") || '<p class="empty">案件がありません</p>';
}

async function openDetail(pid){
  const p = myProjects.find(x=>x.id===pid);
  const logs = await Store.getLogs(pid);
  const prog = logs.length ? logs[0].progress : 0;

  document.getElementById("listView").style.display="none";
  document.getElementById("detailView").style.display="block";
  document.getElementById("dTitle").textContent = p.name;
  document.getElementById("dMeta").textContent = `納期 ${p.dueDate} ・ 担当 ${p.owner}`;
  document.getElementById("dBadge").innerHTML = statusBadge(p.status);
  document.getElementById("dBar").style.width = prog+"%";
  document.getElementById("dBarWrap").className = "bar " + (prog>=100?"full":"");
  document.getElementById("dProg").textContent = prog+"%";

  document.getElementById("timeline").innerHTML = logs.map(l=>{
    const list = Util.splitPhotos(l.photo);
    photoSets[l.id] = list;
    const gal = list.length ? `<div class="gallery">${list.map((u,idx)=>
      `<img class="tl-photo" src="${Util.photoUrl(u)}" alt="現場写真" onclick="openPhotos('${l.id}',${idx})">`).join("")}</div>` : "";
    return `<div class="tl-item">
      <div class="tl-meta">${Util.fmtDate(l.datetime)} ・ ${processMap[l.processId]||""} ・ ${l.status}</div>
      <div class="tl-text">${l.comment||""}</div>
      ${gal}
    </div>`;
  }).join("") || '<p class="empty">まだ記録がありません</p>';
  window.scrollTo({top:0, behavior:"smooth"});
}

document.getElementById("backBtn").onclick = ()=>{
  document.getElementById("detailView").style.display="none";
  document.getElementById("listView").style.display="block";
};

/* セッションが残っていれば自動ログイン */
(function restore(){
  const saved = sessionStorage.getItem("mfg_customer");
  if(saved){ me = JSON.parse(saved); showData(); }
})();
</script>
</body>
</html>
