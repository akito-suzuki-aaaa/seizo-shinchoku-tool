<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>進捗確認 — お客様用</title>
<link rel="stylesheet" href="styles.css?v=13">
</head>
<body>
<!-- ログイン画面 -->
<div class="login-screen" id="loginView">
  <div class="card" style="margin-top:60px">
    <h2>ログイン</h2>
    <label for="loginId">ログインID</label>
    <input type="text" id="loginId" autocomplete="username" placeholder="a-sha">
    <label for="password">パスワード</label>
    <input type="password" id="password" autocomplete="current-password" placeholder="••••">
    <div style="margin-top:16px"><button class="btn btn-primary" id="doLogin">ログイン</button></div>
    <p class="hint" id="loginErr" style="color:var(--danger); min-height:18px; margin-top:8px"></p>
    <p class="hint">デモ用：ID <b>a-sha</b> / パスワード <b>1234</b>（A社）</p>
  </div>
</div>

<!-- サイドバー付きアプリ -->
<div class="app" id="dataView" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="brand-ic">📋</span><div id="brandCo">進捗確認<small>お客様ページ</small></div></div>
    <nav>
      <button class="nav-item active" id="navList"><span class="ni-ic">📁</span>案件一覧</button>
    </nav>
    <div class="side-foot">
      <button class="nav-item" id="logoutBtn"><span class="ni-ic">⎋</span>ログアウト</button>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>
  <div class="content">
    <div class="appbar">
      <button class="hamburger" id="hamburger" aria-label="メニュー">☰</button>
      <div>
        <div class="appbar-title">進捗確認</div>
        <div class="appbar-sub" id="sub">お客様</div>
      </div>
    </div>
    <div class="content-body">
      <div id="listView">
        <div class="card">
          <h2 id="companyName"></h2>
          <div id="projectList"></div>
        </div>
      </div>

      <div id="detailView" style="display:none">
        <p class="hint"><span class="btn btn-sm" id="backBtn">← 案件一覧</span></p>
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px">
            <div>
              <h2 id="dTitle" style="margin:0 0 4px"></h2>
              <p class="hint" id="dMeta" style="margin:0"></p>
            </div>
            <span id="dBadge"></span>
          </div>
          <div style="display:flex; align-items:center; gap:10px; margin:14px 0 4px">
            <div class="bar" id="dBarWrap" style="max-width:none"><span id="dBar" style="width:0%"></span></div>
            <span id="dProg" style="font-weight:600; width:40px"></span>
          </div>
        </div>
        <div class="card">
          <h2>進捗の履歴</h2>
          <div class="timeline" id="timeline"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="store.js?v=13"></script>
<script>
// 顧客端末には他社ぶんを含むデータを保存しない（メモリ内キャッシュのみ）
Store.disableDiskCache();

let me=null, myProjects=[], processMap={}, photoSets={};
window.openPhotos = (logId, idx)=> Util.openImage(photoSets[logId], idx);

// 背景で最新化されたら、一覧表示中なら自動で再描画
Store.onUpdate(async ()=>{
  if(!me) return;
  const all = await Store.getProjects();
  myProjects = all.filter(p=>p.customerId===me.id);
  for(const p of myProjects){ const procs = await Store.getProcesses(p.id); procs.forEach(w=> processMap[w.id]=w.name); }
  if(document.getElementById("listView").style.display!=="none") renderList();
});

/* ---- ログイン ---- */
document.getElementById("doLogin").onclick = login;
document.getElementById("password").addEventListener("keydown", e=>{ if(e.key==="Enter") login(); });

async function login(){
  const id = document.getElementById("loginId").value.trim();
  const pw = document.getElementById("password").value;
  const errEl = document.getElementById("loginErr");
  errEl.textContent = "";
  try{
    me = await Store.login(id, pw);
    sessionStorage.setItem("mfg_customer", JSON.stringify(me));
    await showData();
  }catch(err){
    errEl.textContent = err.message;
  }
}

document.getElementById("logoutBtn").onclick = ()=>{ Store.logout(); sessionStorage.removeItem("mfg_customer"); location.reload(); };

/* サイドメニュー開閉（スマホ） */
function toggleSidebar(open){
  const sb=document.getElementById("sidebar"), bd=document.getElementById("backdrop");
  const show = open===undefined ? !sb.classList.contains("open") : open;
  sb.classList.toggle("open", show); bd.classList.toggle("show", show);
}
document.getElementById("hamburger").onclick = ()=> toggleSidebar();
document.getElementById("backdrop").onclick = ()=> toggleSidebar(false);
document.getElementById("navList").onclick = ()=>{
  document.getElementById("detailView").style.display="none";
  document.getElementById("listView").style.display="block";
  toggleSidebar(false);
};

function backToLogin(){
  Store.logout();
  document.getElementById("dataView").style.display="none";
  document.getElementById("loginView").style.display="block";
}

async function showData(){
  document.getElementById("loginView").style.display="none";
  document.getElementById("dataView").style.display="";
  document.getElementById("sub").textContent = me.company + " 様";
  document.getElementById("brandCo").innerHTML = me.company + "<small>進捗確認</small>";
  document.getElementById("companyName").textContent = me.company + " の案件";
  try{
    const all = await Store.getProjects();
    myProjects = all.filter(p=>p.customerId===me.id);
    for(const p of myProjects){
      const procs = await Store.getProcesses(p.id);
      procs.forEach(w=> processMap[w.id]=w.name);
    }
    renderList();
  }catch(e){
    // トークン切れ等はログイン画面へ戻す
    document.getElementById("loginErr").textContent = e.auth ? "再度ログインしてください" : e.message;
    backToLogin();
  }
}

function statusBadge(s){
  const cls = s==="完了"?"badge-ok": s==="作業中"?"badge-warn":"badge-idle";
  return `<span class="badge ${cls}">${s}</span>`;
}

async function renderList(){
  const rows = [];
  for(const p of myProjects){
    const logs = await Store.getLogs(p.id);
    const prog = logs.length ? logs[0].progress : 0;
    rows.push(`<div class="card" style="cursor:pointer; margin-bottom:10px" onclick="openDetail('${p.id}')">
      <div style="display:flex; justify-content:space-between; align-items:center">
        <div>
          <div style="font-weight:600">${p.name}</div>
          <div class="hint">納期 ${p.dueDate} ・ 担当 ${p.owner}</div>
        </div>
        ${statusBadge(p.status)}
      </div>
      <div style="display:flex; align-items:center; gap:10px; margin-top:10px">
        <div class="bar ${prog>=100?'full':''}"><span style="width:${prog}%"></span></div>
        <span style="font-size:13px; width:36px">${prog}%</span>
      </div>
    </div>`);
  }
  document.getElementById("projectList").innerHTML = rows.join("") || '<p class="empty">案件がありません</p>';
}

async function openDetail(pid){
  const p = myProjects.find(x=>x.id===pid);
  const logs = await Store.getLogs(pid);
  const prog = logs.length ? logs[0].progress : 0;

  document.getElementById("listView").style.display="none";
  document.getElementById("detailView").style.display="block";
  document.getElementById("dTitle").textContent = p.name;
  document.getElementById("dMeta").textContent = `納期 ${p.dueDate} ・ 担当 ${p.owner}`;
  document.getElementById("dBadge").innerHTML = statusBadge(p.status);
  document.getElementById("dBar").style.width = prog+"%";
  document.getElementById("dBarWrap").className = "bar " + (prog>=100?"full":"");
  document.getElementById("dProg").textContent = prog+"%";

  document.getElementById("timeline").innerHTML = logs.map(l=>{
    const list = Util.splitPhotos(l.photo);
    photoSets[l.id] = list;
    const gal = list.length ? `<div class="gallery">${list.map((u,idx)=>
      `<img class="tl-photo" data-ph="${u}" alt="現場写真" onclick="openPhotos('${l.id}',${idx})">`).join("")}</div>` : "";
    return `<div class="tl-item">
      <div class="tl-meta">${Util.fmtDate(l.datetime)} ・ ${processMap[l.processId]||""} ・ ${l.status}</div>
      <div class="tl-text">${l.comment||""}</div>
      ${gal}
    </div>`;
  }).join("") || '<p class="empty">まだ記録がありません</p>';
  Util.hydratePhotos(document.getElementById("timeline"));
  window.scrollTo({top:0, behavior:"smooth"});
}

document.getElementById("backBtn").onclick = ()=>{
  document.getElementById("detailView").style.display="none";
  document.getElementById("listView").style.display="block";
};

/* セッション（トークン）が残っていれば自動ログイン */
(function restore(){
  const saved = sessionStorage.getItem("mfg_customer");
  if(saved && Store.hasToken()){ me = JSON.parse(saved); showData(); }
})();
</script>
</body>
</html>
